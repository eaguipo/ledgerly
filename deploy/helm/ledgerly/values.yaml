# Umbrella values. Each top-level key matches a dependency alias in Chart.yaml
# and is passed to that `service` subchart instance.
#
# Secrets & per-developer Supabase creds do NOT belong here. Supply them via:
#   * Tilt  — reads apps/web/.env.local automatically (the dev default), or
#   * Helm  — `-f values.local.yaml` (copy values.local.yaml.example first).

web:
  fullnameOverride: web
  replicaCount: 1

  image:
    repository: k3d-registry.localhost:5000/ledgerly-web
    tag: dev
    pullPolicy: IfNotPresent

  containerPort: 3000
  service:
    type: ClusterIP
    port: 80
    targetPort: 3000

  ingress:
    enabled: true
    className: nginx
    host: ledgerly.local
    path: /
    pathType: Prefix

  # The Next.js app can be slow to warm on first boot; be patient before probing.
  probes:
    path: /
    initialDelaySeconds: 8
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 6

  # Non-secret runtime env. Real Supabase values are injected by Tilt or
  # values.local.yaml — these placeholders are intentionally invalid.
  env:
    NODE_ENV: production
    NEXT_PUBLIC_SUPABASE_URL: ""
    NEXT_PUBLIC_SUPABASE_ANON_KEY: ""
    # Expense reads/writes now go through the gateway (in-cluster DNS).
    GATEWAY_URL: "http://api-gateway"
    # trace|debug|info|warn|error|fatal. Every service reads the same variable.
    # Raise to debug when chasing a bug: `make dev` already does for all three.
    LOG_LEVEL: info

  # Server-only secret env. Injected by Tilt or values.local.yaml.
  secretEnv:
    SUPABASE_SERVICE_ROLE_KEY: ""

# ── api-gateway: validates the Supabase JWT, routes to services ──────────────
api-gateway:
  fullnameOverride: api-gateway
  replicaCount: 1
  image:
    repository: k3d-registry.localhost:5000/ledgerly-api-gateway
    tag: dev
    pullPolicy: IfNotPresent
  containerPort: 8080
  service:
    type: ClusterIP
    port: 80
    targetPort: 8080
  ingress:
    enabled: false
  probes:
    path: /healthz
    initialDelaySeconds: 4
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 6
  env:
    NODE_ENV: production
    SUPABASE_URL: ""
    SUPABASE_ANON_KEY: ""
    LEDGER_URL: "http://ledger"
    LOG_LEVEL: info
  secretEnv:
    # Optional: set to enable fast local HS256 verification instead of the
    # Supabase Auth introspection fallback. Leave empty to use introspection.
    SUPABASE_JWT_SECRET: ""
    # Shared secret the gateway sends to downstream services (see ledger).
    INTERNAL_API_SECRET: ""
  networkPolicy:
    enabled: true
    ingressFromPods:
      - { app.kubernetes.io/name: web }

# ── ledger: owns income/expense ledger data (schema: public for now) ─────────
ledger:
  fullnameOverride: ledger
  replicaCount: 1
  image:
    repository: k3d-registry.localhost:5000/ledgerly-ledger
    tag: dev
    pullPolicy: IfNotPresent
  containerPort: 8080
  service:
    type: ClusterIP
    port: 80
    targetPort: 8080
  ingress:
    enabled: false
  probes:
    path: /healthz
    initialDelaySeconds: 4
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 6
  env:
    NODE_ENV: production
    SUPABASE_URL: ""
    LOG_LEVEL: info
  secretEnv:
    SUPABASE_SERVICE_ROLE_KEY: ""
    # Must match the gateway's INTERNAL_API_SECRET. Requests without a matching
    # x-internal-secret header are rejected (defense-in-depth over x-user-id).
    INTERNAL_API_SECRET: ""
  networkPolicy:
    enabled: true
    ingressFromPods:
      - { app.kubernetes.io/name: api-gateway }
